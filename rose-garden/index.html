<html lang="en">
<head>
<meta charset="utf-8"><meta name="theme-color" content="#14060b">
<title>A garden for you</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="image" href="assets/bouquet.webp"><link rel="preload" as="image" href="assets/garden.webp">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito:wght@600;800&display=swap" onload="this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito:wght@600;800&display=swap"></noscript>
<style>
:root{--bg:#14060b;--wine:#3b0b18;--rose:#d4112f;--pink:#ffb3c1;--cream:#fff0ea;--gold:#f2c46d;--leaf:#2f8f3a;
--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Nunito',system-ui,sans-serif;--cell:calc(min(94vw,420px)/11)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:var(--sans);overflow:hidden}
body{background:radial-gradient(ellipse at 50% 20%,var(--wine),var(--bg) 70%);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px;opacity:0;pointer-events:none;transition:opacity .8s}
.screen.on{opacity:1;pointer-events:auto}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,13vw,4.6rem);line-height:1.05;letter-spacing:.01em;text-wrap:balance;text-shadow:0 4px 30px rgba(212,17,47,.55)}
.btn{margin-top:34px;font:800 1.25rem var(--sans);color:#fff;background:linear-gradient(180deg,#f0344f,#b30c27);border:0;border-radius:999px;padding:16px 54px;box-shadow:0 8px 28px rgba(212,17,47,.55);cursor:pointer}
.btn:active{transform:scale(.95)}
.blink{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,90,110,.8),0 8px 28px rgba(212,17,47,.55)}50%{opacity:.55;box-shadow:0 0 0 18px rgba(255,90,110,0),0 8px 28px rgba(212,17,47,.2)}}
img#bq{height:44vh;width:auto;max-width:78vw;border-radius:20px;object-fit:cover}
#bq{width:min(78vw,340px);transform:scale(0) rotate(-10deg);transform-origin:50% 90%;filter:drop-shadow(0 14px 30px rgba(0,0,0,.6))}
.on #bq{animation:pop 1.3s cubic-bezier(.2,1.5,.4,1) forwards,sway 4s 1.4s ease-in-out infinite}
@keyframes pop{to{transform:scale(1) rotate(0)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
#hello{font-size:clamp(2rem,9vw,3rem);margin-top:6px;transition:opacity .6s}
#q2{display:none;flex-direction:column;align-items:center}
#q2.show{display:flex;animation:fade 1s}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
#s3{justify-content:flex-start;padding-top:max(18px,env(safe-area-inset-top))}
#msg{font:800 1.05rem var(--sans);color:var(--pink);min-height:3.2em;display:flex;align-items:center;justify-content:center;max-width:340px}
#title{font-size:1.9rem;margin-bottom:2px}
.field{width:min(94vw,420px);aspect-ratio:11/13;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(13,1fr);gap:0;background:linear-gradient(#2a150d,#1d0e08);border-radius:18px;border:2px solid #5a2f1c;box-shadow:inset 0 0 40px #000,0 10px 40px rgba(0,0,0,.5);overflow:hidden}
.cell{position:relative;display:grid;place-items:center;font-size:calc(var(--cell)*.74);cursor:pointer;background:radial-gradient(circle at 50% 72%,#4d2a18 0 34%,transparent 38%)}
.cell.p{cursor:default;background:radial-gradient(circle at 50% 72%,#5b3320 0 40%,transparent 44%)}
.cell>*{position:absolute;pointer-events:none;line-height:1}
.st{bottom:10%;left:50%;width:2px;height:58%;margin-left:-1px;background:var(--leaf);transform-origin:bottom;transform:scaleY(0);transition:transform 1.4s ease-out}
.st::before,.st::after{content:"";position:absolute;width:.34em;height:.18em;background:#3fae4c;border-radius:100% 0;top:45%;opacity:0;transition:opacity .8s .8s}
.st::before{left:100%;transform:rotate(-25deg)}.st::after{right:100%;transform:scaleX(-1) rotate(-25deg)}
.g .st{transform:scaleY(1)}.g .st::before,.g .st::after{opacity:1}
.sd{bottom:22%;transform:scale(0);transition:opacity .6s}
.p .sd{animation:seed .7s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes seed{from{transform:scale(0) translateY(10px)}to{transform:scale(.95)}}
.g .sd{opacity:0}
.rs{top:2%;transform:scale(0) rotate(-40deg);transition:transform 1s cubic-bezier(.2,1.6,.4,1)}
.b .rs{transform:scale(1) rotate(0)}
img.sd,img.gr,img.rs{width:92%;height:92%;object-fit:contain;bottom:4%;left:4%;top:auto}
img.gr{opacity:0;transform:scale(.3);transform-origin:bottom;transition:opacity 1s,transform 1.6s ease-out}
.g img.gr{opacity:1;transform:scale(1)}
img.rs{top:auto;transition:opacity 1s,transform 1s}
.d{transition:opacity 1.5s,filter 1.5s,transform 1.5s;opacity:.07;filter:grayscale(1) brightness(.5);transform:scale(.8)}
.l{transition:transform 1.5s;transform:scale(1.12);z-index:2}
.l .rs{animation:glow 1.6s ease-in-out infinite;filter:drop-shadow(0 0 7px #ff3b57) saturate(1.3)}
.l{background:radial-gradient(circle at 50% 45%,rgba(242,196,109,.55),transparent 72%)}
#msg.big{font:400 2.6rem var(--serif);color:var(--gold);text-shadow:0 0 24px rgba(242,196,109,.7)}
@keyframes glow{50%{transform:scale(1.22)}}
.field{position:relative}
.gv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s;z-index:5;pointer-events:none}
.ripple{left:50%;top:70%;width:6px;height:6px;margin:-3px;border-radius:50%;border:2px solid var(--gold);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(7);opacity:0}}
#offer{margin-top:14px;display:none;flex-direction:column;align-items:center;gap:6px;font-weight:800;color:var(--gold)}
#offer.show{display:flex;animation:fade .7s}
#offer .btn{margin-top:4px;padding:13px 30px;font-size:1.05rem}
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(10,2,5,.78);padding:24px}
#modal.show{display:flex}
.card{max-width:340px;text-align:center;background:linear-gradient(160deg,#4a0f20,#220810);border:2px solid var(--gold);border-radius:26px;padding:34px 26px;box-shadow:0 0 60px rgba(212,17,47,.6);animation:pop2 .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop2{from{transform:scale(.3);opacity:0}}
.card p{font-family:var(--serif);font-size:1.75rem;line-height:1.25}
.card .btn{margin-top:26px}
#s4 h1{font-size:clamp(3.4rem,20vw,6.5rem)}
#s4 .h{display:inline-block;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
#s4 small{margin-top:22px;font-size:1.2rem;color:var(--pink);font-weight:800}
#again{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));background:none;border:0;color:#b98a93;font:600 .9rem var(--sans);text-decoration:underline;cursor:pointer}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}

/* premium layer */
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;filter:blur(7px);animation:drift 20s ease-in-out infinite alternate;
background:radial-gradient(circle at 20% 28%,rgba(255,120,150,.2) 0 6%,transparent 7%),radial-gradient(circle at 82% 18%,rgba(242,196,109,.16) 0 5%,transparent 6%),radial-gradient(circle at 72% 78%,rgba(255,120,150,.15) 0 8%,transparent 9%),radial-gradient(circle at 14% 82%,rgba(242,196,109,.13) 0 5%,transparent 6%)}
@keyframes drift{to{transform:translate(3%,-3%) scale(1.08)}}
body::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(0,0,0,.65)}
.screen{z-index:1}
h1{background:linear-gradient(180deg,#fff7e8 10%,#f2c46d 62%,#c98f3a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 22px rgba(212,17,47,.55))}
#s4 .h{-webkit-text-fill-color:initial;filter:drop-shadow(0 0 16px rgba(255,60,90,.9))}
.btn{border:1.5px solid rgba(242,196,109,.75);letter-spacing:.05em;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 30px rgba(212,17,47,.55)}
img#bq{height:46vh;width:auto;max-width:84vw;border-radius:0;object-fit:contain;filter:drop-shadow(0 18px 26px rgba(0,0,0,.7)) drop-shadow(0 0 38px rgba(212,17,47,.42))}
.field{background:radial-gradient(rgba(0,0,0,.28) 1px,transparent 1.6px) 0 0/9px 9px,radial-gradient(rgba(255,205,150,.08) 1px,transparent 1.6px) 4px 5px/11px 11px,linear-gradient(#3b2114,#22110a);border:1.5px solid rgba(242,196,109,.65);box-shadow:inset 0 0 50px #000,0 0 40px rgba(212,17,47,.22),0 14px 44px rgba(0,0,0,.6)}
img.sd,img.rs{filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.l img.rs{filter:drop-shadow(0 0 9px #ff3b57) drop-shadow(0 3px 4px rgba(0,0,0,.5)) saturate(1.25)}
#msg{color:#ffd6de;letter-spacing:.02em}
#msg.big{font-size:3rem;letter-spacing:.06em;background:linear-gradient(180deg,#fff7e8,#f2c46d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(242,196,109,.75));animation:fade 1.2s}
#title{font-size:2.1rem}
#modal{backdrop-filter:blur(8px)}
.card{background:linear-gradient(160deg,rgba(80,16,34,.85),rgba(28,8,16,.9));border:1.5px solid rgba(242,196,109,.75);box-shadow:0 0 70px rgba(212,17,47,.55),inset 0 1px 0 rgba(255,255,255,.15)}
.card p{background:linear-gradient(180deg,#fff7e8,#f2c46d);-webkit-background-clip:text;background-clip:text;color:transparent}

/* garden scene */
:root{--fw:min(92vw,420px,calc((100svh - 340px)*.846));--cell:calc(var(--fw)/11)}
#s3{background-size:cover;background-position:center bottom;justify-content:flex-start;padding-bottom:max(14px,env(safe-area-inset-bottom))}
#title{filter:drop-shadow(0 3px 14px rgba(0,0,0,.8))}
#msg{text-shadow:0 2px 10px rgba(0,0,0,.9);background:rgba(10,3,6,.4);padding:6px 16px;border-radius:999px;min-height:0;margin-top:6px}
#offer{order:1;margin-top:10px;margin-bottom:6px;background:rgba(10,3,6,.55);padding:12px 18px;border-radius:20px;border:1px solid rgba(242,196,109,.5);backdrop-filter:blur(6px)}
.stage{order:2;margin-top:auto;width:100%;display:flex;justify-content:center;perspective:640px;padding-bottom:6px}
.field{width:var(--fw);transform:rotateX(30deg);transform-origin:50% 100%;overflow:hidden;
background:radial-gradient(rgba(0,0,0,.3) 1px,transparent 1.6px) 0 0/8px 8px,radial-gradient(rgba(255,205,150,.12) 1px,transparent 1.6px) 4px 4px/10px 10px,linear-gradient(rgba(84,50,30,.74),rgba(52,29,17,.82));
border:2px dashed rgba(255,226,160,.9);border-radius:14px;box-shadow:0 0 0 7px rgba(70,40,24,.28),0 22px 30px rgba(0,0,0,.5)}
.cell{background:radial-gradient(circle at 50% 72%,rgba(25,12,6,.6) 0 17%,transparent 22%)}
.cell.p{background:radial-gradient(circle at 50% 72%,#3a1f12 0 38%,transparent 42%)}

/* v5: wide bed on the lawn, SORRY on one line */
:root{--fw:min(88vw,460px);--cell:calc(var(--fw)/19)}
.stage{perspective:none;justify-content:flex-start;padding-left:4vw;padding-bottom:max(3vh,12px)}
.field{aspect-ratio:19/11;grid-template-columns:repeat(19,1fr);grid-template-rows:repeat(11,1fr);transform:none;border:3px solid #9a6a3e;border-radius:10px;
background:radial-gradient(rgba(0,0,0,.32) 1px,transparent 1.6px) 0 0/7px 7px,radial-gradient(rgba(255,205,150,.14) 1px,transparent 1.6px) 3px 4px/9px 9px,linear-gradient(rgba(78,46,27,.93),rgba(46,25,14,.95));
box-shadow:0 0 0 4px #5b3820,0 0 0 5px rgba(242,196,109,.55),0 20px 28px rgba(0,0,0,.55),inset 0 0 26px rgba(0,0,0,.65)}
.cell{font-size:calc(var(--cell)*.8)}
.l{transform:scale(1.6);z-index:3;background:radial-gradient(circle at 50% 50%,rgba(255,200,120,.4),transparent 70%)}
.d{opacity:.16;filter:grayscale(.5) brightness(.7)}

/* v6: full-screen grow video, static SORRY made only of roses */
.gv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:25;border-radius:0}
.l{background:none}
.l .rs{animation:none}
.l img.rs,.l .rs{filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}

/* v7: sound button + share sheet */
#snd{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:35;width:42px;height:42px;border-radius:50%;border:1px solid rgba(242,196,109,.55);background:rgba(10,3,6,.5);backdrop-filter:blur(6px);font-size:1.1rem;color:#fff;cursor:pointer}
.mk{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));background:none;border:0;color:#c9a0a9;font:700 .9rem var(--sans);text-decoration:underline;cursor:pointer}
#share{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(10,2,5,.8);backdrop-filter:blur(8px);padding:24px}
#share.show{display:flex}
#share .card{width:100%}
#share .card p{font-size:1.6rem}
#share input{width:100%;margin-top:16px;padding:14px 16px;border-radius:14px;border:1.5px solid rgba(242,196,109,.6);background:rgba(0,0,0,.35);color:#fff0ea;font:700 1.05rem var(--sans);text-align:center}
.chips{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.chips button{border:1px solid rgba(242,196,109,.5);background:transparent;color:#ffd6de;border-radius:999px;padding:8px 13px;font:700 .85rem var(--sans);cursor:pointer}
.chips .on{background:#b30c27;color:#fff}
.row{display:flex;gap:10px;margin-top:12px;justify-content:center}
.row .btn{margin-top:0;padding:11px 24px;font-size:1rem}
.x{margin-top:14px;background:none;border:0;color:#b98a93;font:600 .9rem var(--sans);text-decoration:underline;cursor:pointer}

/* v8: lively motion */
@keyframes rise{0%{opacity:0;transform:translateY(46px) scale(.82);filter:blur(8px)}60%{opacity:1;transform:translateY(-9px) scale(1.05);filter:blur(0)}100%{opacity:1;transform:none}}
.screen.on>*{animation:rise .95s cubic-bezier(.2,1.3,.4,1) backwards}
.screen.on>*:nth-child(2){animation-delay:.14s}.screen.on>*:nth-child(3){animation-delay:.28s}.screen.on>*:nth-child(4){animation-delay:.42s}
.screen.on>.blink{animation:rise .95s .14s cubic-bezier(.2,1.3,.4,1) backwards,blink 1.1s 1.3s ease-in-out infinite}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 2.8s 1.2s infinite}
@keyframes shine{to{left:140%}}
.p .sd{transform-origin:50% 100%;animation:seed .7s cubic-bezier(.2,1.6,.4,1) forwards,wig 2.6s .8s ease-in-out infinite}
@keyframes wig{0%,100%{transform:scale(.95) rotate(-6deg)}50%{transform:scale(.95) rotate(6deg)}}
.b .rs{animation:flash 1.1s cubic-bezier(.2,1.6,.4,1)}
@keyframes flash{from{filter:brightness(2.8) saturate(.5)}}

/* v9: speed + premium finish */
body::before{filter:none;animation:none;inset:0}
.screen.on>*{animation-name:rise2}
.screen.on>.blink{animation:rise2 .95s .14s cubic-bezier(.2,1.3,.4,1) backwards,blink 1.1s 1.3s ease-in-out infinite}
@keyframes rise2{0%{opacity:0;transform:translateY(40px) scale(.9)}60%{opacity:1;transform:translateY(-8px) scale(1.03)}100%{opacity:1;transform:none}}
h1{filter:none;text-shadow:none}
#s2::before{content:"";position:absolute;left:50%;top:46%;width:92vmin;height:92vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(212,17,47,.42),rgba(212,17,47,.12) 45%,transparent 68%);z-index:-1}
img#bq{filter:none}
.btn::after{left:0;animation:shine2 3s 1.2s infinite;transform:translateX(-150%) skewX(-20deg)}
@keyframes shine2{to{transform:translateX(450%) skewX(-20deg)}}
.cell{contain:layout style}
.d{filter:none;opacity:.14;transition:opacity 1.2s,transform 1.2s}
img.sd,img.rs,img.gr,.l img.rs,.l .rs{filter:none;animation:none}
img.sd{height:70%;width:70%;left:15%;bottom:6%;transform:scale(0);transform-origin:50% 100%}
.p img.sd{animation:seed .7s cubic-bezier(.2,1.6,.4,1) forwards,wig 3s .8s ease-in-out infinite}
img.gr{width:100%;height:100%;left:0;bottom:0}
img.rs{height:62%;width:92%;left:4%;bottom:34%;top:auto}
.b img.rs{animation:flash 1.1s cubic-bezier(.2,1.6,.4,1)}
#offer,#msg{backdrop-filter:none}
.field{box-shadow:0 0 0 4px #5b3820,0 0 0 5px rgba(242,196,109,.55),0 16px 24px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* v10: premium finish */
:root{--serif:'Cormorant Garamond','Playfair Display',Georgia,serif;--gold2:#e9c581}
h1{font-weight:700;letter-spacing:.015em;line-height:1.02;font-size:clamp(2.7rem,13.5vw,4.8rem)}
#title{font-size:2.3rem;font-style:italic}
#hello{font-style:italic}
.btn{font-family:var(--sans);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:1rem;padding:17px 52px;
 background:linear-gradient(180deg,#e5304b 0%,#a30b24 100%);border:1px solid rgba(233,197,129,.85);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 6px rgba(60,0,10,.45),0 12px 28px rgba(160,10,36,.5),0 0 0 4px rgba(233,197,129,.08)}
.blink{animation:breathe 2.4s ease-in-out infinite!important}

@keyframes breathe{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 6px rgba(60,0,10,.45),0 14px 36px rgba(200,20,50,.7),0 0 0 10px rgba(233,197,129,.05)}}

#msg{font-family:var(--sans);font-weight:800;font-size:.95rem;letter-spacing:.04em;background:rgba(14,5,8,.55);border:1px solid rgba(233,197,129,.25);padding:8px 20px}
#offer{background:linear-gradient(160deg,rgba(60,12,26,.78),rgba(16,5,10,.82));border:1px solid rgba(233,197,129,.55);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);border-radius:22px;padding:16px 20px}
#offer span{font-family:var(--serif);font-size:1.35rem;font-weight:700;color:var(--gold2)}
.field{background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.42)),url(assets/soil.webp) 0 0/230px;border:0;border-radius:12px;
 box-shadow:0 0 0 6px #6b4526,0 0 0 8px #3d2412,0 0 0 9px rgba(233,197,129,.35),0 22px 34px rgba(0,0,0,.6),inset 0 6px 18px rgba(0,0,0,.75),inset 0 -2px 8px rgba(255,200,140,.08)}
.cell{background:radial-gradient(ellipse at 50% 80%,rgba(0,0,0,.45) 0 22%,transparent 45%)}

    <path d="M62 190L238 190L192 332L108 332Z" fill="#f4b8c4"/><path d="M62 190L150 262L108 332Z" fill="#e48fa2"/><path d="M238 190L150 262L192 332Z" fill="#ffd0da"/>

<canvas id="fx"></canvas>

<script>
/* REAL PHOTOS: paste image URLs (or ./images/xxx.png when hosted on GitHub Pages). Use transparent PNGs. Empty = built-in graphics. */
const IMG={bouquet:'assets/bouquet.webp',seed:'assets/seed.webp',grown:'assets/grown.webp',bloom:'assets/bloom.webp',growVideo:'assets/grow.mp4'}; /* growVideo: short mp4 of a plant growing */
async function playGrow(f){
  const v=document.createElement('video');v.className='gv';v.src=IMG.growVideo;v.muted=true;v.playsInline=true;v.preload='auto';f.appendChild(v);
  try{await v.play()}catch(e){v.remove();return}
  v.style.opacity=1;
  await Promise.race([new Promise(r=>{v.onended=r;v.onerror=r}),new Promise(r=>setTimeout(r,25000))]);
  v.style.opacity=0;await new Promise(r=>setTimeout(r,1000));v.remove();
}
const SONG='assets/song.mp3';
const GARDEN='assets/garden.webp';
const $=id=>document.getElementById(id), wait=ms=>new Promise(r=>setTimeout(r,ms));
$('s3').style.backgroundImage="linear-gradient(rgba(10,3,6,.78),rgba(10,3,6,.18) 32%,rgba(10,3,6,0) 58%,rgba(10,3,6,.3)),url('"+GARDEN+"')";
if(IMG.bouquet){const i=new Image();i.id='bq';i.src=IMG.bouquet;i.alt='Rose bouquet';$('bq').replaceWith(i)}
const show=id=>document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));

/* falling petal layer */
/* petal / heart / sparkle / leaf sprites, drawn once */
const SP=(()=>{const mk=fn=>{const c=document.createElement('canvas');c.width=c.height=64;fn(c.getContext('2d'));return c};
const petal=(a,b)=>mk(g=>{const r=g.createRadialGradient(24,42,3,32,34,36);r.addColorStop(0,a);r.addColorStop(1,b);g.fillStyle=r;g.beginPath();g.moveTo(32,60);g.bezierCurveTo(0,44,4,6,32,3);g.bezierCurveTo(60,6,64,44,32,60);g.fill();g.strokeStyle='rgba(255,255,255,.2)';g.lineWidth=1.6;g.beginPath();g.moveTo(32,55);g.quadraticCurveTo(29,33,32,11);g.stroke()});
const heart=(a,b)=>mk(g=>{const r=g.createRadialGradient(24,22,2,32,32,34);r.addColorStop(0,a);r.addColorStop(1,b);g.fillStyle=r;g.beginPath();g.moveTo(32,58);g.bezierCurveTo(2,38,6,6,24,8);g.bezierCurveTo(30,9,32,14,32,17);g.bezierCurveTo(32,14,34,9,40,8);g.bezierCurveTo(58,6,62,38,32,58);g.fill();g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(21,19,6,3.5,-.6,0,6.3);g.fill()});
const star=()=>mk(g=>{const r=g.createRadialGradient(32,32,0,32,32,30);r.addColorStop(0,'rgba(255,248,220,1)');r.addColorStop(.25,'rgba(242,196,109,.9)');r.addColorStop(1,'rgba(242,196,109,0)');g.fillStyle=r;g.fillRect(0,0,64,64);g.fillStyle='#fff7e0';g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,l=i%2?5:26;g.lineTo(32+Math.cos(a)*l,32+Math.sin(a)*l)}g.fill()});
const leaf=()=>mk(g=>{const r=g.createLinearGradient(8,56,56,8);r.addColorStop(0,'#1f6b2c');r.addColorStop(1,'#6fbf5e');g.fillStyle=r;g.beginPath();g.moveTo(8,56);g.bezierCurveTo(4,22,30,4,58,6);g.bezierCurveTo(60,34,36,60,8,56);g.fill()});
const P=[petal('#e0263f','#6e0716'),petal('#c1122f','#4f0310'),petal('#ff8a9f','#c43656')],H=[heart('#ff7a93','#c1122f'),heart('#ffb3c1','#e0405f')],S=[star()],L=[leaf()];
return{'🌹':P.slice(0,2),'🌸':[P[2]],'❤️':H,'💖':H,'💕':H,'💗':H,'⭐':S,'✨':S,'🌱':L,'🍃':L,'💚':L}})();

const cv=$('fx'),cx=cv.getContext('2d');let W,H,P=[],run=false,dpr=Math.min(devicePixelRatio||1,1.5);
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener('resize',size);
function rain(n,set,fromTop=true){
  for(let i=0;i<n;i++)P.push({e:set[i%set.length],x:Math.random()*W,y:fromTop?-Math.random()*H*1.1-30:H+20,
    vy:(fromTop?1:-1)*(2+Math.random()*3.5),sw:Math.random()*6.28,sa:.4+Math.random()*1.2,s:20+Math.random()*26,r:Math.random()*6.28,vr:(Math.random()-.5)*.08});
  if(!run){run=true;requestAnimationFrame(tick)}
}
function burst(x,y,n,set,o={}){if(P.length>420)n=Math.ceil(n/3);
 for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(o.v||5)*(.4+Math.random()*.9);
  P.push({e:set[i%set.length],c:o.c,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(o.lift||2),g:o.g??.14,s:o.c?2+Math.random()*3:(o.s||16)+Math.random()*14,r:Math.random()*6,vr:(Math.random()-.5)*.25,life:(o.life||70)+Math.random()*30})}}
function burstEl(el,n,set,o){const b=el.getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2,n,set,o)}
function puff(x,y){burst(x,y,9,[''],{c:'#6b3f26',v:2.6,lift:1.2,g:.08,life:34});burst(x,y,6,['✨','🌱','💚'],{v:3.2,lift:2.5,s:13,life:60})}
setInterval(()=>{if(P.length<70&&!document.hidden){if(!run){run=true;requestAnimationFrame(tick)}P.push({e:['🌸','🌹','✨'][Math.random()*3|0],x:Math.random()*W,y:-20,vy:.7+Math.random()*1.2,sw:Math.random()*6.28,sa:.3+Math.random()*.6,s:12+Math.random()*10,r:Math.random()*6,vr:(Math.random()-.5)*.03,a:.5})}},700);
function tick(){
  cx.clearRect(0,0,W,H);if(!P.length){run=false;return}
  P=P.filter(p=>p.life!==undefined?p.life>0:(p.y<H+60&&p.y>-120));
  for(const p of P){
    if(p.life!==undefined){p.life--;p.vx*=.985;p.vy=p.vy*.985+p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.globalAlpha=Math.min(1,p.life/25)}
    else{p.y+=p.vy;p.sw+=.04;p.x+=Math.sin(p.sw)*p.sa;p.r+=p.vr;cx.globalAlpha=p.a||1}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
    if(p.c){cx.fillStyle=p.c;cx.beginPath();cx.arc(0,0,p.s,0,6.3);cx.fill()}
    else{const v=SP[p.e];if(v){p.k=p.k??(Math.random()*v.length|0);if(p.life===undefined&&(p.e==='🌹'||p.e==='🌸'))cx.scale(1,.3+.7*Math.abs(Math.cos(p.sw*1.4)));cx.drawImage(v[p.k],-p.s/2,-p.s/2,p.s,p.s)}}
    cx.restore()}
  cx.globalAlpha=1;requestAnimationFrame(tick);
}
run=true;requestAnimationFrame(tick);

/* sound: all synthesized, original melody */
const A=(()=>{
 let ctx,master,mus,on=true,timer,step=0,next=0,lastPop=0,fd;const song=new Audio(SONG);song.loop=true;song.volume=.55;song.preload='none';
 const m2f=m=>440*Math.pow(2,(m-69)/12),EI=.4;
 const CH=[[48,55,60,64],[45,52,57,60],[41,48,53,57],[43,50,55,59]];
 const ME=[[76,79,84,83,79,76,79,0],[81,79,76,79,81,84,81,0],[77,81,84,81,79,77,76,0],[74,79,83,79,77,74,71,0]];
 function unlock(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ctx=new C();master=ctx.createGain();master.gain.value=on?.9:0;master.connect(ctx.destination);mus=ctx.createGain();mus.gain.value=.4;mus.connect(master)}if(ctx.state!=='running')ctx.resume()}
 function note(f,t,d,o={}){if(!ctx)return;const g=ctx.createGain(),q=ctx.createOscillator();q.type=o.type||'sine';q.frequency.setValueAtTime(f,t);if(o.to)q.frequency.exponentialRampToValueAtTime(o.to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(o.v||.2,t+(o.a||.005));g.gain.exponentialRampToValueAtTime(.0001,t+d);q.connect(g);g.connect(o.bus||master);q.start(t);q.stop(t+d+.05)}
 const bell=(f,t,d,v,bus)=>{note(f,t,d,{v,bus});note(f*2,t,d*.6,{v:v*.3,bus});note(f*3,t,d*.3,{v:v*.12,bus})};
 function sched(){if(!ctx)return;while(next<ctx.currentTime+.4){const bar=Math.floor(step/8)%4,i=step%8,c=CH[bar],t=next;
  if(i===0){note(m2f(c[0]),t,2.6,{v:.2,a:.01,bus:mus});c.slice(1).forEach(m=>note(m2f(m+12),t,3.2,{type:'triangle',v:.045,a:.9,bus:mus}))}
  if(i===2||i===4||i===6)bell(m2f(c[i/2]+12),t,1.2,.06,mus);
  if(ME[bar][i])bell(m2f(ME[bar][i]),t,1.7,.13,mus);
  step++;next+=EI}}
 const T=()=>ctx.currentTime,P=[72,74,76,79,81];
 return{
  unlock,
  music(){unlock();song.play().catch(()=>{})},
  level(v){clearInterval(fd);fd=setInterval(()=>{const d=v-song.volume;if(Math.abs(d)<.02){song.volume=v;clearInterval(fd)}else song.volume=Math.min(1,Math.max(0,song.volume+d*.08))},60)},
  celebrate(){if(!ctx)return;const t=T(),n=ctx.sampleRate*.18|0,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
   const q=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='highpass';f.frequency.value=1800;g.gain.value=.35;q.buffer=b;q.connect(f);f.connect(g);g.connect(master);q.start(t);note(130,t,.2,{to:70,v:.25});
   [79,83,86,91,95].forEach((m,i)=>bell(m2f(m),t+.05+i*.06,1.1,.11))},
  tick(){if(!ctx)return;note(880,T(),.09,{v:.1});note(1320,T()+.05,.1,{v:.07})},
  pop(){if(!ctx)return;const t=T();if(t-lastPop<.05)return;lastPop=t;note(260+Math.random()*120,t,.14,{to:620,v:.16});note(110,t,.12,{v:.2})},
  sparkle(){if(!ctx)return;[72,76,79,84,88,91].forEach((m,i)=>bell(m2f(m),T()+i*.09,1.3,.12))},
  chime(){if(!ctx)return;bell(m2f(79),T(),1.4,.14);bell(m2f(84),T()+.14,1.6,.14)},
  grow(){if(!ctx)return;A.level(.6);note(180,T(),3,{to:560,v:.09,a:.8});for(let i=0;i<6;i++)bell(m2f(P[i%5]+12),T()+.5+i*.4,1.5,.08)},
  bloom(){if(!ctx)return;A.level(.5);for(let i=0;i<16;i++)bell(m2f(P[Math.floor(Math.random()*5)]+12*(i%2)),T()+i*.13+Math.random()*.08,1.6,.1)},
  sorry(){if(!ctx)return;[60,64,67,71,74].forEach(m=>note(m2f(m),T(),6,{type:'triangle',v:.09,a:1.3}))},
  final(){if(!ctx)return;A.level(.45);[72,76,79,84,88].forEach((m,i)=>bell(m2f(m),T()+i*.12,1.8,.14));
   setInterval(()=>{if(!ctx)return;const t=T();note(95,t,.2,{to:60,v:.22});note(90,t+.2,.2,{to:58,v:.14})},1100)},
  toggle(){on=!on;song.muted=!on;if(master)master.gain.setTargetAtTime(on?.9:0,T(),.05);return on}
 }})();
document.addEventListener('pointerdown',()=>A.unlock());
document.addEventListener('click',e=>{const b=e.target.closest('.btn,.mk,.chips button');if(!b)return;A.celebrate();burstEl(b,b.classList.contains('btn')?30:14,['🌹','💖','✨','🌸','💕','⭐'],{v:7});if(navigator.vibrate)navigator.vibrate([18,40,18]);b.animate([{transform:'scale(1)'},{transform:'scale(1.14)'},{transform:'scale(.96)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'})});
$('snd').onclick=()=>{$('snd').textContent=A.toggle()?'🔊':'🔇'};

/* name + sharing */
const qs=new URLSearchParams(location.search),FROM=qs.get('from');
const NAME=((FROM||'Somrat').trim().slice(0,24))||'Somrat',OBJ={him:'him',her:'her',them:'them'}[qs.get('p')]||(FROM?'them':'him');
$('sorryTxt').innerHTML='<span id="nmA"></span> is extremely, very sorry. 🌹<br>You should love '+OBJ+'.';
$('nmA').textContent=NAME;$('frm').textContent='from '+NAME;document.title='A garden for you, from '+NAME;
let pr='him';
$('pr').onclick=e=>{const b=e.target.closest('button');if(!b)return;pr=b.dataset.p;[...$('pr').children].forEach(x=>x.classList.toggle('on',x===b))};
$('shareBtn').onclick=$('mk1').onclick=()=>$('share').classList.add('show');
$('cl').onclick=()=>$('share').classList.remove('show');
$('mkLink').onclick=()=>{const n=$('nm').value.trim().slice(0,24);if(!n){$('nm').focus();return}
 $('lnk').value=location.href.split('?')[0].split('#')[0]+'?from='+encodeURIComponent(n)+'&p='+pr;$('out').style.display='block';$('sh').style.display=navigator.share?'':'none'};
$('cp').onclick=async()=>{const l=$('lnk');try{await navigator.clipboard.writeText(l.value)}catch(e){l.select();document.execCommand('copy')}$('cp').textContent='Copied ✓';setTimeout(()=>$('cp').textContent='Copy',1500)};
$('sh').onclick=()=>navigator.share({title:'A garden for you',text:'I made this for you 🌹',url:$('lnk').value}).catch(()=>{});

/* 1 -> 2 */
$('yes1').onclick=async()=>{
  A.music();show('s2');fetch(IMG.growVideo).catch(()=>{});
  rain(130,['🌹']);
  await wait(1500);rain(40,['🌹','🌸']);
  await wait(2400);
  $('hello').style.opacity=0;await wait(500);
  $('hello').style.display='none';$('q2').classList.add('show');A.chime();
};

/* 2 -> garden */
const G={S:['111','100','111','001','111'],O:['111','101','101','101','111'],R:['111','101','111','110','101'],Y:['101','101','010','010','010']};
const L=new Set(),put=(ch,r,c)=>G[ch].forEach((row,i)=>[...row].forEach((v,j)=>v==='1'&&L.add((r+i)+','+(c+j))));
put('S',3,0);put('O',3,4);put('R',3,8);put('R',3,12);put('Y',3,16);
const cells=[];let planted=0,mode='plant';
const field=$('field');
for(let r=0;r<11;r++)for(let c=0;c<19;c++){
  const d=document.createElement('div');d.className='cell';
  const im=(k,c,e)=>IMG[k]?`<img class="${c}" src="${IMG[k]}" alt="">`:e;
  d.innerHTML=(IMG.grown?im('grown','gr',''):'<i class="st"></i>')+im('seed','sd','<b class="sd">🌱</b>')+im('bloom','rs','<b class="rs">🌹</b>');
  d.dataset.l=L.has(r+','+c)?1:'';
  field.appendChild(d);cells.push(d);
}
field.addEventListener('click',e=>{
  if(mode!=='plant')return;
  const b=field.getBoundingClientRect(),c=Math.min(18,Math.max(0,Math.floor((e.clientX-b.left)/b.width*19))),r=Math.min(10,Math.max(0,Math.floor((e.clientY-b.top)/b.height*11)));
  let t=cells[r*19+c];
  if(t.classList.contains('p')){t=cells.filter(x=>!x.classList.contains('p')).map(x=>{const i=cells.indexOf(x);return[x,Math.hypot(Math.floor(i/19)-r,i%19-c)]}).sort((a,b)=>a[1]-b[1])[0];if(!t||t[1]>2.5)return;t=t[0]}
  plant(t,true);planted++;puff(e.clientX,e.clientY);
  $('msg').textContent=planted<4?planted+' planted. Keep going.':'Nice! Your garden is starting.';
  if(planted>=4)$('offer').classList.add('show');
});
function plant(d,ripple){
  d.classList.add('p');A.pop();
  if(ripple){const i=document.createElement('i');i.className='ripple';d.appendChild(i);setTimeout(()=>i.remove(),700)}
  if(navigator.vibrate&&ripple)navigator.vibrate(15);
}
$('yes2').onclick=()=>{show('s3')};

/* auto fill -> grow -> bloom -> sorry */
$('auto').onclick=async()=>{
  mode='auto';$('offer').classList.remove('show');
  $('msg').textContent='Planting seedlings…';
  const rest=cells.filter(c=>!c.classList.contains('p')).sort(()=>Math.random()-.5);
  rest.forEach((c,i)=>setTimeout(()=>{plant(c);if(i%3===0)burstEl(c,4,['✨','🌱'],{v:2.4,s:12,life:45})},i*(1600/rest.length)));
  await wait(2600);
  $('msg').textContent='Growing…';A.grow();
  if(IMG.growVideo)await playGrow(document.body);
  cells.forEach(c=>setTimeout(()=>{c.classList.add('g');if(Math.random()<.4)burstEl(c,2,['✨','🍃'],{v:1.6,lift:3.4,g:-.02,s:12,life:55})},Math.random()*1300));
  await wait(IMG.growVideo?1800:3300);
  $('msg').textContent='Blooming…';A.bloom();
  cells.forEach(c=>setTimeout(()=>{c.classList.add('b');burstEl(c,2,['🌸','✨'],{v:3.2,lift:3,s:11,life:60})},Math.random()*1800));
  rain(30,['🌹','🌸'],false);
  await wait(3200);
  $('msg').style.visibility='hidden';A.sorry();
  cells.forEach(c=>c.classList.add(c.dataset.l?'l':'d'));
  await wait(9500);
  $('modal').classList.add('show');A.chime();burst(W/2,H*.45,50,['✨','💖','🌹','🌸'],{v:9,life:90});
};

/* popup -> final */
$('ok').onclick=()=>{
  $('modal').classList.remove('show');show('s4');A.final();setInterval(()=>burst(W*(.15+Math.random()*.7),H*(.15+Math.random()*.4),22,['❤️','💖','✨','🌹'],{v:7,life:80}),1500);
  rain(70,['❤️','💖','🌹','💕']);
  setInterval(()=>rain(6,['❤️','💖','🌹','💕']),900);
};
$('again').onclick=()=>location.reload();
</script>
</body>
